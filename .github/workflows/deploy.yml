name: 🚀 Full MERN Deploy (Backend + Dashboard + User)

on:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  statuses: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # ===============================
      # 📥 CHECKOUT CODE
      # ===============================
      - name: 📥 Checkout Repository
        uses: actions/checkout@v3

      # ===============================
      # 🟢 SETUP NODE
      # ===============================
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      # ===============================
      # 🔧 CONFIGURE GIT
      # ===============================
      - name: 🔧 Configure Git
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

      # =====================================================
      # 🔥 BACKEND (Render Deploy)
      # =====================================================
      - name: 📦 Install Backend Dependencies
        working-directory: ./backend
        run: npm install

      - name: 🚀 Deploy Backend to Render
        uses: render-oss/deploy-action@v1
        with:
          serviceId: ${{ secrets.RENDER_SERVICE_ID }}
          apiKey: ${{ secrets.RENDER_API_KEY }}

      # =====================================================
      # 🎛 ADMIN DASHBOARD (Netlify)
      # =====================================================
      - name: 📦 Install Dashboard Dependencies
        working-directory: ./frontend-dashboard
        run: npm install

      - name: 🏗 Build Dashboard
        working-directory: ./frontend-dashboard
        run: npm run build

      - name: 🚀 Deploy Dashboard to Netlify
        uses: nwtgck/actions-netlify@v2
        with:
          publish-dir: ./frontend-dashboard/dist
          production-branch: main
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: "🚀 Dashboard Deploy from GitHub Actions"
          enable-pull-request-comment: false
          enable-commit-comment: false
          enable-commit-status: true
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.DASHBOARD_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_DASHBOARD_SITE_ID }}

      # =====================================================
      # 🛍 USER FRONTEND (Netlify)
      # =====================================================
      - name: 📦 Install User Frontend Dependencies
        working-directory: ./my-ecommerce
        run: npm install

      - name: 🏗 Build User Frontend
        working-directory: ./my-ecommerce
        run: npm run build

      - name: 🚀 Deploy User Frontend to Netlify
        uses: nwtgck/actions-netlify@v2
        with:
          publish-dir: ./my-ecommerce/dist
          production-branch: main
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: "🚀 User Frontend Deploy from GitHub Actions"
          enable-pull-request-comment: false
          enable-commit-comment: false
          enable-commit-status: true
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.USER_SITE_ID }}

      # ===============================
      # ✅ DONE
      # ===============================
      - name: ✅ Deployment Complete
        run: echo "🚀 All apps deployed successfully!"